name: Build Quotation Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: quotation-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller pillow
      - name: Create logo icon
        run: python -c "from PIL import Image; Image.open('LOGO.png').convert('RGBA').save('LOGO.ico',sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])"
      - name: Build quotation software
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon "LOGO.ico" --name 常青文创设计报价系统 --add-data "LOGO.png;." quotation_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: 常青文创设计报价系统-Windows-新版
          path: quotation-system/dist/常青文创设计报价系统.exe
